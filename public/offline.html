<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B5C4D">
<title>Luring · Talangan</title>
<style>
/* Berkas statis tanpa JavaScript: dilayani service worker untuk URL mana pun, jadi tidak boleh
   dihidrasi Next. Warna disalin dari token --color-tl-* di src/app/globals.css. */
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: #F6F4EE; color: #1C1B17; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.spanduk { background: #FFEFB8; color: #4A3000; padding: 12px 16px; font-weight: 600; font-size: 14px; line-height: 1.4; }
main { flex: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 16px; padding: 24px 16px; max-width: 480px; }
img { width: 64px; height: 64px; border-radius: 14px; }
h1 { margin: 0; font-size: 22px; line-height: 1.25; }
p { margin: 0; font-size: 16px; line-height: 1.5; color: #4F4B42; }
a { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 20px; border-radius: 12px; background: #0B5C4D; color: #fff; font-size: 16px; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<div class="spanduk" role="status">Kamu sedang luring. Sambungkan internet untuk melihat data terbaru.</div>
<main>
<img src="/ikon/192" alt="" width="64" height="64">
<h1>Tidak ada sambungan</h1>
<p>Data talangan dan status bayar selalu diambil langsung dari server, jadi tidak bisa dibuka tanpa internet.</p>
<a href="/">Coba lagi</a>
</main>
</body>
</html>
